# =============================================================================
# docx-to-pdf.yml
# =============================================================================
# 【這個檔案的定位】
# 「進階轉檔（GitHub Actions + LibreOffice）」功能的後端本體。使用者
# 把整個 repo Fork 到自己帳號底下之後，這份工作流程檔案會跟著一起
# 複製過去，不需要額外安裝任何東西——GitHub 本身就會依這份設定跑。
#
# 【觸發方式】
# 監聽 incoming/ 目錄下有新檔案被 push 進來（前端透過 GitHub Contents
# API，用使用者自己的 Personal Access Token 上傳檔案到這個路徑，這個
# push 動作本身就會自動觸發這份工作流程，不需要額外呼叫
# workflow_dispatch，前端邏輯可以更單純）。
#
# 【多種目標格式：用資料夾名稱表達「要轉成什麼」】
# incoming/ 底下不是直接放檔案，而是依「目標格式」分子資料夾，例如
# incoming/pdf/{任務ID}.docx、incoming/html/{任務ID}.docx、
# incoming/png/{任務ID}.docx。這個資料夾名稱本身就是要傳給
# `soffice --convert-to` 的目標格式，前端上傳檔案時只要決定好要放進
# 哪個子資料夾，不需要另外傳遞任何額外參數，設計最單純。
# 轉檔結果對應輸出到 outgoing/{格式}/ 底下，檔名開頭是同一個任務 ID，
# 副檔名依實際輸出類型而定（pdf/html 是單一檔案；png/jpg 因為 Word
# 文件可能有多頁、一次只能有一個圖檔，實際輸出是包含每一頁圖片的
# {任務ID}.zip）。
#
# 【流程】
# 1. checkout 使用者自己 Fork 出來的 repo
# 2. 安裝 LibreOffice + 中文字型 + poppler-utils（png/jpg 輸出要用它
#    的 pdftoppm 把 PDF 每一頁轉成圖片）
# 3. 依 incoming/ 底下每個子資料夾（目標格式）分別轉檔
# 4. 把轉檔結果 commit 回 repo 的 outgoing/ 目錄，並把用過的 incoming/
#    來源檔案一併刪除（避免 incoming 目錄越堆越多垃圾）
# 5. 前端透過輪詢 outgoing/{格式}/ 目錄，偵測到以任務 ID 開頭的結果
#    檔案出現就下載
#
# 【已知取捨，使用者應該知道的事】
# - 每次轉檔都是一次真正的 git commit，repo 的版本紀錄會隨著使用次數
#   增長。如果很在意這件事，可以定期手動清理/重寫這個 repo 的歷史紀錄
#   （例如用 git rebase 或直接重新 Fork 一份新的），這份工作流程本身
#   不會自動幫你清。
# - 免費額度：公開 repo 的 GitHub Actions 用量通常有相當充足的免費
#   額度，但仍屬於使用者自己帳號的額度，用量請自行留意 GitHub 帳號的
#   Actions 使用狀況頁面。
# - 速度：每次轉檔都是全新開一台虛擬機、重新安裝 LibreOffice，單次
#   大約需要 30 秒到 2 分鐘不等，不是即時的。
# - png/jpg 輸出是多頁圖片包成一個 zip，不是單張圖，前端下載後需要
#   自己解壓縮。
# =============================================================================

name: docx-to-pdf

on:
  push:
    paths:
      - 'incoming/**'

# 需要能夠把轉檔結果 commit 回這個 repo。
permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    # 避免這份工作流程自己 commit 轉檔結果時，又觸發自己一次無窮迴圈
    # ——用 commit 訊息裡的固定標記字串來判斷是不是自己產生的 commit。
    if: "!contains(github.event.head_commit.message, '[docx-to-pdf-bot]')"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LibreOffice and tools
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends libreoffice-writer poppler-utils
          # ⭐ 修正「輸出 PDF 中文字全部變成同一個字」的 bug ⭐
          # GitHub 提供的 ubuntu-latest 環境預設完全沒有裝任何中文/CJK
          # 字型。LibreOffice 遇到文件裡要求的字型（例如新細明體、
          # 微軟正黑體）在系統裡找不到時，會靜默替換成隨便一個可用
          # 字型，這個替換字型如果沒有對應的中文字形資料，轉出來的
          # PDF 裡每個中文字就會被畫成同一個「缺字替代」符號——這正是
          # 我們實測遇到的「整份文件的中文字全部變成『前』字」的成因，
          # 不是轉檔邏輯錯誤，是執行環境缺字型。
          # 安裝 Google 的 Noto CJK 字型（涵蓋繁體中文、簡體中文、
          # 日文、韓文），讓 LibreOffice 有真正的中文字形可以畫。
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          # ⭐ 修正「內容跑到下一頁、跟 Word 分頁位置對不齊」的殘留落差 ⭐
          # 文件實際指定的西文字型是 Calibri、標題字型是 Cambria——這兩個
          # 都是微軟的授權字型，沒辦法透過 apt 免費安裝正版。但 LibreOffice
          # 本身內建一份「metric-compatible」字型替換表：只要系統裡有
          # Carlito（跟 Calibri 逐字寬完全相同，只有筆畫細節不同）、
          # Caladea（跟 Cambria 逐字寬相同），就會自動拿來替換 Calibri/
          # Cambria，寬度算出來的結果會跟 Word 用 Calibri/Cambria 排版
          # 幾乎一致，不會再因為「隨便換成某個寬度不同的字型」而讓斷行
          # 位置跟著跑掉。沒裝這兩個字型的話，LibreOffice 會退而求其次
          # 換成寬度不保證一致的字型，這正是先前「http 那一行跑到第二頁」
          # 的殘留落差來源之一。
          sudo apt-get install -y --no-install-recommends fonts-crosextra-carlito fonts-crosextra-caladea
          # 字型快取重建，確保 LibreOffice 啟動時抓得到新裝的字型。
          sudo fc-cache -f -v

      - name: Preprocess docx (table page-break fix + tighter spacing)
        run: |
          # ⭐ 自動修正「表格被分頁攔腰截斷、頁尾多出空框」的問題，並嘗試
          # 「緊排版」讓內容盡量留在原本的頁面，不要被整段推到下一頁 ⭐
          # 詳細原理說明見對話紀錄／README；這裡統一在轉檔前先處理過
          # incoming/ 底下所有子資料夾裡的每一個 .docx。
          python3 - <<'PYEOF'
          import glob
          import re
          import zipfile
          import shutil
          import os

          def patch_docx(path):
              tmp_path = path + '.tmp'
              with zipfile.ZipFile(path, 'r') as zin:
                  names = zin.namelist()
                  if 'word/document.xml' not in names:
                      return
                  with zipfile.ZipFile(tmp_path, 'w', zipfile.ZIP_DEFLATED) as zout:
                      for item in names:
                          data = zin.read(item)

                          if item == 'word/document.xml':
                              text = data.decode('utf-8')
                              text, count = re.subn(
                                  r'<w:tr(?:\s[^>]*)?>',
                                  lambda m: m.group(0) + '<w:trPr><w:cantSplit/></w:trPr>',
                                  text,
                              )
                              print(f'  {path}: 已處理 {count} 個表格列（cantSplit）')
                              data = text.encode('utf-8')

                          elif item == 'word/styles.xml':
                              text = data.decode('utf-8')
                              original_text = text

                              def tighten_spacing(match):
                                  tag = match.group(0)
                                  tag = re.sub(r'w:after="\d+"', 'w:after="60"', tag)
                                  tag = re.sub(r'w:line="\d+"', 'w:line="240"', tag)
                                  return tag

                              text, count = re.subn(
                                  r'<w:spacing\s+[^/]*/>',
                                  tighten_spacing,
                                  text,
                              )
                              if text != original_text:
                                  print(f'  {path}: 已調緊 {count} 處預設段落間距')
                              data = text.encode('utf-8')

                          zout.writestr(item, data)
              shutil.move(tmp_path, path)

          for path in glob.glob('incoming/**/*.docx', recursive=True):
              try:
                  patch_docx(path)
              except Exception as e:
                  print(f'  {path}: 前處理失敗（{e}），將直接轉換原始檔案，不中斷流程')
          PYEOF

      - name: Convert incoming files
        run: |
          mkdir -p outgoing
          shopt -s nullglob

          # incoming/ 底下每個子資料夾名稱就是目標格式（pdf / html /
          # png / jpg...），對應輸出到 outgoing/{同名格式}/。
          for dir in incoming/*/; do
            format=$(basename "$dir")
            mkdir -p "outgoing/$format"

            for f in "$dir"*.docx "$dir"*.doc "$dir"*.odt; do
              [ -e "$f" ] || continue
              task_id=$(basename "$f")
              task_id="${task_id%.*}"
              echo "Converting: $f -> $format"

              if [ "$format" = "png" ] || [ "$format" = "jpg" ]; then
                # png/jpg：Word 文件可能有多頁，LibreOffice 一次只能匯出
                # 一張圖，所以先轉成 PDF，再用 pdftoppm 把每一頁各自轉成
                # 圖片，最後打包成一個 zip 當作輸出（一頁的情況 zip 裡也
                # 只會有一張圖，但格式維持一致，前端統一用解壓縮的方式
                # 處理，不用另外判斷「這次是不是剛好只有一頁」）。
                tmp_dir=$(mktemp -d)
                soffice --headless --norestore --convert-to pdf --outdir "$tmp_dir" "$f"
                pdf_file="$tmp_dir/$(basename "${f%.*}").pdf"
                if [ -e "$pdf_file" ]; then
                  img_ext="$format"
                  [ "$format" = "jpg" ] && poppler_fmt="jpeg" || poppler_fmt="png"
                  pdftoppm "-$poppler_fmt" -r 150 "$pdf_file" "$tmp_dir/page"
                  (cd "$tmp_dir" && zip -q "$task_id.zip" page-*."$img_ext" 2>/dev/null || zip -q "$task_id.zip" page-*.jpg 2>/dev/null || zip -q "$task_id.zip" page-*.png 2>/dev/null)
                  mv "$tmp_dir/$task_id.zip" "outgoing/$format/"
                fi
                rm -rf "$tmp_dir"
              else
                # pdf / html：LibreOffice 直接支援的單檔輸出格式。
                soffice --headless --norestore --convert-to "$format" --outdir "outgoing/$format" "$f"
              fi
            done
          done

      - name: Commit result and clean up source files
        run: |
          git config user.name "docx-to-pdf-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm -rf --ignore-unmatch incoming
          git add outgoing
          git diff --cached --quiet && echo "No changes to commit" || \
            git commit -m "[docx-to-pdf-bot] convert ${{ github.sha }}"
          git push

