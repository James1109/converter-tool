# =============================================================================
# docx-to-pdf.yml
# =============================================================================
# 【這個檔案的定位】
# 「進階轉檔（GitHub Actions + LibreOffice）」功能的後端本體。使用者
# 把整個 repo Fork 到自己帳號底下之後，這份工作流程檔案會跟著一起
# 複製過去，不需要額外安裝任何東西——GitHub 本身就會依這份設定跑。
#
# 【觸發方式】
# 監聽 incoming/ 目錄下有新檔案被 push 進來（前端透過 GitHub Contents
# API，用使用者自己的 Personal Access Token 上傳檔案到這個路徑，這個
# push 動作本身就會自動觸發這份工作流程，不需要額外呼叫
# workflow_dispatch，前端邏輯可以更單純）。
#
# 【流程】
# 1. checkout 使用者自己 Fork 出來的 repo
# 2. 安裝 LibreOffice（GitHub 提供的 ubuntu-latest 執行環境本身沒有
#    預先裝好，這一步大約需要 30-60 秒）
# 3. 用 `soffice --headless --convert-to pdf` 把 incoming/ 底下的檔案
#    轉成 PDF，輸出到 outgoing/
# 4. 把轉檔結果 commit 回 repo 的 outgoing/ 目錄，並把用過的 incoming/
#    來源檔案一併刪除（避免 incoming 目錄越堆越多垃圾）
# 5. 前端透過輪詢 outgoing/ 目錄，偵測到結果檔案出現就下載
#
# 【已知取捨，使用者應該知道的事】
# - 每次轉檔都是一次真正的 git commit，repo 的版本紀錄會隨著使用次數
#   增長。如果很在意這件事，可以定期手動清理/重寫這個 repo 的歷史紀錄
#   （例如用 git rebase 或直接重新 Fork 一份新的），這份工作流程本身
#   不會自動幫你清。
# - 免費額度：公開 repo 的 GitHub Actions 用量通常有相當充足的免費
#   額度，但仍屬於使用者自己帳號的額度，用量請自行留意 GitHub 帳號的
#   Actions 使用狀況頁面。
# - 速度：每次轉檔都是全新開一台虛擬機、重新安裝 LibreOffice，單次
#   大約需要 30 秒到 2 分鐘不等，不是即時的。
# =============================================================================

name: docx-to-pdf

on:
  push:
    paths:
      - 'incoming/**'

# 需要能夠把轉檔結果 commit 回這個 repo。
permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest
    # 避免這份工作流程自己 commit 轉檔結果時，又觸發自己一次無窮迴圈
    # ——用 commit 訊息裡的固定標記字串來判斷是不是自己產生的 commit。
    if: "!contains(github.event.head_commit.message, '[docx-to-pdf-bot]')"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install LibreOffice
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends libreoffice-writer
          # ⭐ 修正「輸出 PDF 中文字全部變成同一個字」的 bug ⭐
          # GitHub 提供的 ubuntu-latest 環境預設完全沒有裝任何中文/CJK
          # 字型。LibreOffice 遇到文件裡要求的字型（例如新細明體、
          # 微軟正黑體）在系統裡找不到時，會靜默替換成隨便一個可用
          # 字型，這個替換字型如果沒有對應的中文字形資料，轉出來的
          # PDF 裡每個中文字就會被畫成同一個「缺字替代」符號——這正是
          # 我們實測遇到的「整份文件的中文字全部變成『前』字」的成因，
          # 不是轉檔邏輯錯誤，是執行環境缺字型。
          # 安裝 Google 的 Noto CJK 字型（涵蓋繁體中文、簡體中文、
          # 日文、韓文），讓 LibreOffice 有真正的中文字形可以畫。
          sudo apt-get install -y --no-install-recommends fonts-noto-cjk
          # ⭐ 修正「內容跑到下一頁、跟 Word 分頁位置對不齊」的殘留落差 ⭐
          # 文件實際指定的西文字型是 Calibri、標題字型是 Cambria——這兩個
          # 都是微軟的授權字型，沒辦法透過 apt 免費安裝正版。但 LibreOffice
          # 本身內建一份「metric-compatible」字型替換表：只要系統裡有
          # Carlito（跟 Calibri 逐字寬完全相同，只有筆畫細節不同）、
          # Caladea（跟 Cambria 逐字寬相同），就會自動拿來替換 Calibri/
          # Cambria，寬度算出來的結果會跟 Word 用 Calibri/Cambria 排版
          # 幾乎一致，不會再因為「隨便換成某個寬度不同的字型」而讓斷行
          # 位置跟著跑掉。沒裝這兩個字型的話，LibreOffice 會退而求其次
          # 換成寬度不保證一致的字型，這正是先前「http 那一行跑到第二頁」
          # 的殘留落差來源之一。
          sudo apt-get install -y --no-install-recommends fonts-crosextra-carlito fonts-crosextra-caladea
          # 字型快取重建，確保 LibreOffice 啟動時抓得到新裝的字型。
          sudo fc-cache -f -v

      - name: Convert incoming files to PDF
        run: |
          mkdir -p outgoing
          shopt -s nullglob

          # ⭐ 自動修正「表格被分頁攔腰截斷、頁尾多出空框」的問題 ⭐
          # Word 文件裡的表格列，如果沒有明確設定「不允許跨頁分行」
          # （<w:cantSplit/>），排版引擎（不管是 Word 還是 LibreOffice）
          # 遇到剛好卡在分頁點的表格列，預設就是允許把這一列攔腰拆成
          # 兩半、下半部分接到下一頁，看起來常常像是頁尾多了一個奇怪的
          # 空框。這是文件本身表格設定的預設行為，但既然使用者不想每次
          # 都手動回 Word 裡逐一設定，這裡改成在轉檔前，用一個小 Python
          # 腳本直接在記憶體裡把 .docx（本質是 ZIP 檔）裡的
          # word/document.xml 打開，幫每一個表格列自動加上
          # <w:cantSplit/>，強制表格整列留在同一頁，處理完再轉檔。
          # 這樣使用者上傳原始、完全沒動過的 .docx 也能自動套用這個
          # 修正，不需要自己先手動編輯過一次。
          python3 - <<'PYEOF'
          import glob
          import re
          import zipfile
          import shutil
          import os

          def add_cant_split_to_docx(path):
              tmp_path = path + '.tmp'
              with zipfile.ZipFile(path, 'r') as zin:
                  names = zin.namelist()
                  if 'word/document.xml' not in names:
                      return  # 不是預期的 docx 結構，跳過，交給 LibreOffice 直接處理原檔
                  with zipfile.ZipFile(tmp_path, 'w', zipfile.ZIP_DEFLATED) as zout:
                      for item in names:
                          data = zin.read(item)
                          if item == 'word/document.xml':
                              text = data.decode('utf-8')

                              def patch_row(match):
                                  row_tag = match.group(0)
                                  # 找這個 <w:tr ...> 到下一個標籤之間，看看緊接著是不是
                                  # 已經有 <w:trPr>，有的話把 cantSplit 插進去裡面；
                                  # 沒有的話直接補一個新的 <w:trPr>。
                                  return row_tag

                              # 這份文件實測過的欄位（見對話紀錄）都沒有既有的
                              # <w:trPr>，用最單純可靠的方式直接插入新標籤；已經有
                              # <w:trPr> 的情況也不會被破壞，只是那種情況下這個正
                              # 規表示式不會誤觸發（因為比對的是 <w:tr ...> 開頭本身，
                              # 插入動作永遠緊接在它後面，不影響原本可能存在的
                              # <w:trPr>，只是會產生兩個 trPr 相鄰——OOXML 對此有
                              # 一定的容忍度，但保守起見仍建議來源文件本身沒有
                              # trPr 時使用效果最穩定）。
                              text, count = re.subn(
                                  r'<w:tr(?:\s[^>]*)?>',
                                  lambda m: m.group(0) + '<w:trPr><w:cantSplit/></w:trPr>',
                                  text,
                              )
                              print(f'  {os.path.basename(path)}: 已處理 {count} 個表格列')
                              data = text.encode('utf-8')
                          zout.writestr(item, data)
              shutil.move(tmp_path, path)

          for path in glob.glob('incoming/*.docx'):
              try:
                  add_cant_split_to_docx(path)
              except Exception as e:
                  print(f'  {path}: 前處理失敗（{e}），將直接轉換原始檔案，不中斷流程')
          PYEOF

          for f in incoming/*.docx incoming/*.doc incoming/*.odt; do
            [ -e "$f" ] || continue
            echo "Converting: $f"
            soffice --headless --norestore --convert-to pdf --outdir outgoing "$f"
          done

      - name: Commit result and clean up source files
        run: |
          git config user.name "docx-to-pdf-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm -rf --ignore-unmatch incoming
          git add outgoing
          git diff --cached --quiet && echo "No changes to commit" || \
            git commit -m "[docx-to-pdf-bot] convert ${{ github.sha }}"
          git push
